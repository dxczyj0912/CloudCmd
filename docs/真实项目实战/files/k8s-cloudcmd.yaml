apiVersion: v1
kind: Namespace
metadata:
  name: cloudcmd-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudcmd
  namespace: cloudcmd-lab
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: cloudcmd
  template:
    metadata:
      labels:
        app: cloudcmd
    spec:
      containers:
        - name: cloudcmd
          image: cloudcmd:lab-1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8787
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "8787"
            - name: CLOUDCMD_DATA_DIR
              value: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8787
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8787
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cloudcmd
  namespace: cloudcmd-lab
spec:
  type: ClusterIP
  selector:
    app: cloudcmd
  ports:
    - port: 8787
      targetPort: 8787
