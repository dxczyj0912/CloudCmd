name: Publish signed Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'New versionName, for example 1.3.5'
        required: true
        type: string
      version_code:
        description: 'New Android versionCode, greater than the published version'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate version inputs
        shell: pwsh
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          if ($env:VERSION_NAME -notmatch '^[0-9]+(\.[0-9]+){1,3}$') { throw 'Invalid version_name' }
          if ($env:VERSION_CODE -notmatch '^[1-9][0-9]*$') { throw 'Invalid version_code' }
          if ([long]$env:VERSION_CODE -gt 2100000000) { throw 'version_code exceeds Android limit' }
      - name: Install Android toolchain
        shell: pwsh
        run: ./tools/android/setup-toolchain.ps1
      - name: Restore signing key from GitHub Secrets
        shell: pwsh
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:APK_KEYSTORE_BASE64) { throw 'APK_KEYSTORE_BASE64 is missing' }
          $path = Join-Path $env:RUNNER_TEMP 'cloudcmd-release.p12'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:APK_KEYSTORE_BASE64))
          "CLOUDCMD_KEYSTORE=$path" >> $env:GITHUB_ENV
      - name: Build signed APK and verify content
        shell: pwsh
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          CLOUDCMD_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          CLOUDCMD_KEYSTORE_PASS: ${{ secrets.APK_KEYSTORE_PASS }}
          CLOUDCMD_KEY_PASS: ${{ secrets.APK_KEY_PASS }}
          APK_CERT_SHA256: ${{ secrets.APK_CERT_SHA256 }}
        run: |
          if (-not $env:APK_CERT_SHA256) { throw 'APK_CERT_SHA256 is missing' }
          node tools/build-apk.js --version-code=$env:VERSION_CODE --version-name=$env:VERSION_NAME
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/release-check.js --apk=CloudCmd-$env:VERSION_NAME.apk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $java = Join-Path $env:LOCALAPPDATA 'Android\jdk\bin\java.exe'
          $signer = Join-Path $env:LOCALAPPDATA 'Android\Sdk\build-tools\34.0.0\lib\apksigner.jar'
          $certificate = & $java -jar $signer verify --print-certs "CloudCmd-$env:VERSION_NAME.apk"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $match = [regex]::Match(($certificate -join "`n"), 'Signer #1 certificate SHA-256 digest:\s*([0-9a-fA-F]+)')
          if (-not $match.Success) { throw 'Cannot read APK signing certificate fingerprint' }
          $expected = $env:APK_CERT_SHA256.Replace(':', '').ToLowerInvariant()
          if ($match.Groups[1].Value.ToLowerInvariant() -ne $expected) { throw 'APK signer differs from the installed app' }
      - uses: actions/upload-artifact@v4
        with:
          name: cloudcmd-signed-apk
          path: CloudCmd-${{ inputs.version_name }}.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: cloudcmd-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cloudcmd-signed-apk
      - name: Configure trusted SSH connection
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Publish to the live update endpoint
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          [[ "$VERSION_NAME" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          port="${DEPLOY_SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]]
          apk="CloudCmd-${VERSION_NAME}.apk"
          remote_file="/tmp/cloudcmd-apk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.apk"
          digest="$(sha256sum "$apk" | cut -d ' ' -f1)"
          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519)
          scp "${ssh_opts[@]}" -P "$port" "$apk" "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_file}"
          ssh "${ssh_opts[@]}" -p "$port" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash /opt/cloudcmd/tools/publish-apk.sh '${remote_file}' '${VERSION_NAME}' '${VERSION_CODE}' '${digest}' '${GITHUB_SHA}'"
