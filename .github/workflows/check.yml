name: CloudCmd checks
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    env:
      CLOUDCMD_VERSION_CODE: '1'
      CLOUDCMD_VERSION_NAME: '0.0.0-ci'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Data, simulator, lesson and security checks
        run: node tools/check-all.js --quick
      - name: Browser interaction checks
        run: node tools/render-check.js
      - name: Lab and mobile viewport checks
        run: node tools/lab-check.js
      - name: Android toolchain
        shell: pwsh
        run: ./tools/android/setup-toolchain.ps1
      - name: Unsigned APK build and content parity
        run: |
          node tools/build-apk.js --no-sign --version-code=${{ env.CLOUDCMD_VERSION_CODE }} --version-name=${{ env.CLOUDCMD_VERSION_NAME }}
          node tools/apk-check.js --apk=CloudCmd-${{ env.CLOUDCMD_VERSION_NAME }}.apk

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudcmd-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Package verified commit
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar HEAD | gzip -n > cloudcmd-source.tar.gz
          sha256sum cloudcmd-source.tar.gz | cut -d ' ' -f1 > cloudcmd-source.sha256
      - name: Configure trusted SSH connection
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_SSH_KEY" || test -n "$DEPLOY_PASSWORD"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if [[ -n "$DEPLOY_SSH_KEY" ]]; then
            printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          elif ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Upload and deploy
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          port="${DEPLOY_SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]]
          remote_file="/tmp/cloudcmd-${GITHUB_SHA}-${GITHUB_RUN_ID}.tar.gz"
          remote_script="/tmp/cloudcmd-deploy-${GITHUB_SHA}-${GITHUB_RUN_ID}.sh"
          transport=()
          ssh_opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes)
          if [[ -f ~/.ssh/id_ed25519 ]]; then
            ssh_opts+=(-o BatchMode=yes -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$DEPLOY_PASSWORD"
            transport=(sshpass -e)
            ssh_opts+=(-o PreferredAuthentications=password -o PubkeyAuthentication=no)
          fi
          "${transport[@]}" scp "${ssh_opts[@]}" -P "$port" cloudcmd-source.tar.gz "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_file}"
          "${transport[@]}" scp "${ssh_opts[@]}" -P "$port" tools/deploy-server.sh "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_script}"
          digest="$(cat cloudcmd-source.sha256)"
          "${transport[@]}" ssh "${ssh_opts[@]}" -p "$port" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash '${remote_script}' '${remote_file}' '${digest}' '${GITHUB_SHA}'"
